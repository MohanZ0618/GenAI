services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: fintrace
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: fintrace
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fintrace_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrace"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fintrace_pg:
